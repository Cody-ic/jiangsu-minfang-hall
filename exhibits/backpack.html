<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应急背包打包挑战 | 虚拟民防体验馆</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="../index.html"><span class="dot"></span>虚拟民防体验馆</a>
  <nav>
    <a href="../index.html">展馆地图</a>
    <a href="../passport.html">我的证书</a>
    <span class="progress-pill" id="progressPill">0 / 15 已体验</span>
  </nav>
</div>

<div class="exhibit-header">
  <span class="tag">展项 15 · 决策挑战</span>
  <h1>🎒 应急背包打包挑战</h1>
  <p class="desc">背包只有 6 个位置，从这些物资里选出真正该带的应急用品。</p>
</div>

<div class="wrap">
  <div class="stage">
    <div class="backpack-grid" id="itemGrid"></div>
    <div class="pack-slots" id="slotsLabel">已装 0 / 6</div>

    <div style="margin-top:16px;">
      <button class="btn primary" id="packBtn" onclick="submitPack()">打包完成</button>
      <button class="btn" onclick="resetPack()">重新打包</button>
    </div>

    <div class="pack-result" id="packResult" style="display:none;"></div>
  </div>

  <a class="back-link" href="../index.html">← 返回展馆地图</a>
</div>

<script src="../js/common.js"></script>
<script src="../js/backpack.js"></script>
</body>
</html>
